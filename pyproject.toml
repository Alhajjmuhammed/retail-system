[tool.ruff]
line-length = 96
target-version = "py313"
exclude = [".venv", "*/migrations/*", "staticfiles"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # import order
    "B",      # bugbear
    "UP",     # pyupgrade
    "SIM",    # simplify
    "DJ",     # Django-specific
    "PIE",
    "RUF",
]
ignore = [
    # Django's Meta classes and model field declarations are mutable class
    # attributes by design; ClassVar annotations on them are noise.
    "RUF012",
    # Decimal("0") is deliberate: constructing money from a string rather
    # than a float is the habit that avoids binary rounding surprises.
    "FURB157",
    # Line length is enforced by formatting, not by failing the build on a
    # long string in a docstring.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Settings modules legitimately use star imports.
"config/settings/*.py" = ["F403", "F405"]
# Tests assert on broad exceptions where the point is that *something* is
# refused by the database rather than which exception class it raises.
"tests/*.py" = ["B017"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = "test_*.py"
addopts = "--reuse-db -q"
