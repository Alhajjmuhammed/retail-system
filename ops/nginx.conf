# In front of gunicorn. Terminates TLS, serves the built assets, and keeps
# uploads to a size a shop's photo of a product will fit into.

upstream retail {
    server 127.0.0.1:8000;
    keepalive 16;
}

# Named, never a catch-all. This box may host other sites, and a server
# block with `server_name _` that loads first becomes the default for every
# name pointed at the machine -- including theirs.
server {
    listen 80;
    server_name app.example.com;
    # Everything except the health check goes to HTTPS.
    location /healthz { proxy_pass http://retail; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # A product photo from a phone camera.
    client_max_body_size 12M;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Everything the pages need is served from here; nothing is loaded from
    # anywhere else except the web font, and nothing may frame the site.
    # 'unsafe-eval' is for Alpine: its standard build evaluates every
    # x-show and @click through new Function(). Without it the interface
    # is inert -- and every page still answers 200, so nothing says so.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-eval'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # /static/ is deliberately not served from here. The built assets live
    # inside the image, at a path this machine cannot see, and a copy on the
    # host goes stale the first time the image is rebuilt. They are served by
    # the application instead -- compressed, with hashed filenames and a
    # year-long immutable cache header, which is what an alias here was for.

    # Public files only (product photos, logos), from the directory compose
    # mounts into the containers. Receipts live in /app/private, which is not
    # mounted here and is streamed by Django after a permission check.
    location /media/ {
        alias /opt/retail/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://retail;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER reads this; without it Django redirects
        # forever thinking the request is still plain HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
