# app.example.com - the retail / point-of-sale system
#
# Django runs under gunicorn on a unix socket (retail.service). nginx serves
# the collected static files and the product photos itself, and proxies the
# rest. Named server_name, never a catch-all: this box hosts other sites.

upstream retail_app {
    server unix:/run/retail/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    access_log /var/log/nginx/retail.access.log;
    error_log  /var/log/nginx/retail.error.log;

    # A product photo from a phone camera.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # Everything the pages need is served from here; nothing is loaded from
    # anywhere else except the web font, and nothing may frame the site.
    # 'unsafe-eval' is for Alpine: its standard build evaluates every
    # x-show and @click through new Function(). Without it the interface
    # is inert -- and every page still answers 200, so nothing says so.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-eval'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Hashed filenames, so these can be cached for a year.
    location /static/ {
        alias /var/www/retail/staticfiles/;
        access_log off;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Public files only (product photos, logos). Receipts live in
    # /var/www/retail/private, which is not served here: Django streams them
    # after a permission check.
    location /media/ {
        alias /var/www/retail/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://retail_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER reads this; without it Django redirects
        # forever thinking the request is still plain HTTP.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
