# One command to run the whole thing. Works with podman compose or docker
# compose; nothing here is specific to either.

services:
  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: retail
      # Read by ops/bootstrap_db.sql when the database is first created, to
      # set the password of the role the application connects as.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./ops/bootstrap_db.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retail"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    env_file: .env
    environment:
      # Set here, not in .env: inside the network the database is `db`, and
      # the application connects as retail_app so row-level security binds it.
      DATABASE_URL: postgres://retail_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/retail
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./media:/app/media:z
      - private:/app/private
    ports:
      - "127.0.0.1:8000:8000"
    # podman drops the image's own HEALTHCHECK (it is not part of the OCI
    # format), so it is repeated here. $$ keeps compose from expanding it.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Host: $${ALLOWED_HOSTS%%,*}\" -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  # Trials, usage, the fiscal queue and stock alerts. Without these the
  # platform needs somebody watching it.
  worker:
    build: .
    env_file: .env
    command: ["sh", "-c", "exec celery -A config worker -l info --concurrency ${CELERY_CONCURRENCY:-2}"]
    environment:
      # As above.
      DATABASE_URL: postgres://retail_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/retail
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes:
      - ./media:/app/media:z
      - private:/app/private
    restart: unless-stopped

  beat:
    build: .
    env_file: .env
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    environment:
      # As above.
      DATABASE_URL: postgres://retail_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD}@db:5432/retail
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  # Product photos are a bind mount, not a volume: nginx runs on the host and
  # cannot see inside a volume. See `location /media/` in ops/nginx.conf.
  #
  # Receipts stay in a volume. Deliberately not mounted into nginx.
  private:
