{% comment %}
The modal shell.

Wrapped around every platform form. Escape and a click outside both close it,
because a dialog you cannot dismiss is worse than a page.
{% endcomment %}
<div x-data="{ open: true }"
     x-show="open"
     x-trap.noscroll="open"
     @keydown.escape.window="open = false; setTimeout(() => $el.remove(), 150)"
     @click.self="open = false; setTimeout(() => $el.remove(), 150)"
     x-transition:enter="transition ease-out duration-150"
     x-transition:enter-start="opacity-0"
     class="fixed inset-0 z-50 flex items-end justify-center overflow-y-auto bg-ink-950/50 p-3 backdrop-blur-sm sm:items-start sm:p-6 sm:pt-16">

  <div class="w-full {{ width|default:'max-w-lg' }} rounded-2xl bg-white shadow-float"
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="translate-y-6 sm:translate-y-0 sm:scale-95">

    <div class="flex items-start justify-between gap-4 border-b border-ink-100 px-5 py-4">
      <div class="min-w-0">
        <h2 class="text-base font-semibold tracking-tight text-ink-900">{{ title }}</h2>
        {% if subtitle %}<p class="hint">{{ subtitle }}</p>{% endif %}
      </div>
      <button type="button" @click="open = false; setTimeout(() => $root.remove(), 150)"
              class="-mr-1 -mt-1 shrink-0 rounded-lg p-1.5 text-ink-400 transition hover:bg-ink-100 hover:text-ink-700"
              aria-label="Close">
        <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    {{ body }}
  </div>
</div>
