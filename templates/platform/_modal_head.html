{% comment %}Shared modal header: title, optional hint, and a close button.{% endcomment %}
<div class="flex items-start justify-between gap-4 border-b border-ink-100 px-5 py-4">
  <div class="min-w-0">
    <h2 class="truncate text-base font-semibold tracking-tight text-ink-900">{{ title }}</h2>
    {% if subtitle %}<p class="hint">{{ subtitle }}</p>{% endif %}
  </div>
  {% if modal %}
  <button type="button" @click="$root.remove()" class="-mr-1 -mt-1 shrink-0 rounded-lg p-1.5 text-ink-400 hover:bg-ink-100" aria-label="Close">
    <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
  </button>
  {% endif %}
</div>
