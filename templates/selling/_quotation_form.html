{% comment %}New quotation: who it is for, and how long the price is held.{% endcomment %}
<form method="post" action="{% url 'selling:quotation_create' %}" class="space-y-4 p-5">
  {% csrf_token %}
  <div>
    <label class="label" for="customer">Who it is for</label>
    <select name="customer" id="customer" class="input" required autofocus>
      <option value="">Choose a customer</option>
      {% for c in customers %}
      <option value="{{ c.pk }}" {% if chosen == c.pk %}selected{% endif %}>{{ c.name }}</option>
      {% endfor %}
    </select>
    <p class="hint">A quotation goes to a customer on your list, so their address and TIN print on it.</p>
  </div>
  <div>
    <label class="label" for="valid_days">Hold the price for</label>
    <select name="valid_days" id="valid_days" class="input w-40">
      <option value="7">7 days</option>
      <option value="14" selected>14 days</option>
      <option value="30">30 days</option>
      <option value="60">60 days</option>
      <option value="90">90 days</option>
    </select>
  </div>
  <div>
    <label class="label" for="note">Note</label>
    <textarea name="note" id="note" rows="2" maxlength="500" class="input" placeholder="Anything that should print under the lines"></textarea>
  </div>
  <div class="flex justify-end gap-2">
    <a href="{% url 'selling:quotation_list' %}" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary">Start it</button>
  </div>
</form>
