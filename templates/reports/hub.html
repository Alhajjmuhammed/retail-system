{% extends "base.html" %}
{% block title %}All reports{% endblock %}
{% block heading %}All reports{% endblock %}
{% block content %}
<div class="grid gap-3 sm:grid-cols-2 xl:grid-cols-3">
  {% for r in reports %}
  <a href="{% url r.url %}" class="card card-body block transition hover:bg-ink-50">
    <p class="font-semibold text-ink-900">{{ r.title }}</p>
    <p class="mt-1 text-sm text-ink-600">{{ r.text }}</p>
  </a>
  {% endfor %}
</div>
{% endblock %}
