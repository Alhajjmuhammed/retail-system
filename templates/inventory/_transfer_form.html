{% if modal %}
<div x-data x-show="true" @keydown.escape.window="$root.remove()" @click.self="$root.remove()"
     class="fixed inset-0 z-50 flex items-end justify-center overflow-y-auto bg-ink-950/50 p-3 backdrop-blur-sm sm:items-start sm:p-6 sm:pt-16">
  <div class="w-full max-w-md rounded-2xl bg-white shadow-float">
{% include "platform/_modal_head.html" with title="New transfer" subtitle="From "|add:request.branch.name %}
{% endif %}
<form method="post" action="{% url 'inventory:transfer_create' %}" class="space-y-4 p-5">
  {% csrf_token %}
  {% if branches %}
  <div>
    <label class="label" for="to_branch">Send to</label>
    <select name="to_branch" id="to_branch" class="input" required>
      {% for b in branches %}<option value="{{ b.pk }}">{{ b.name }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label class="label" for="note">Note</label>
    <input type="text" name="note" id="note" maxlength="200" class="input" placeholder="Optional">
  </div>
  <div class="flex justify-end gap-2">
    {% if modal %}<button type="button" @click="$root.remove()" class="btn btn-secondary">Cancel</button>{% endif %}
    <button type="submit" class="btn btn-primary">Create and add items</button>
  </div>
  {% else %}
  <p class="text-sm text-ink-600">There is no other open branch to send stock to.</p>
  {% endif %}
</form>
{% if modal %}
  </div>
</div>
{% endif %}
