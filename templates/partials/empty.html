<div class="empty">
  <span class="empty-icon">{% icon icon|default:"box" class="h-5 w-5" %}</span>
  <p class="empty-title">{{ title }}</p>
  {% if text %}<p class="empty-text">{{ text }}</p>{% endif %}
  {% if action_url %}<a href="{{ action_url }}" class="btn btn-secondary btn-sm mt-2">{{ action_label }}</a>{% endif %}
</div>
